# Render Blueprint: deploys the site as a static site from the main branch.
# Reference: https://render.com/docs/blueprint-spec and https://render.com/docs/static-site-headers
#
# The per-page Content-Security-Policy (script hashes) is added at build time by
# scripts/add-csp.mjs. The headers below cover what a <meta> tag cannot.
# tests/static-server.mjs reads this file, so the smoke tests run with these exact headers.
services:
  - type: web
    runtime: static
    name: nimbrial-website
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    # Deploy only after every GitHub check on the commit has passed.
    autoDeployTrigger: checksPass
    envVars:
      # Must match .nvmrc (a smoke test checks this).
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      # Clickjacking: no site may frame these pages. Also locks <base> and <form> targets.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
      # Legacy clickjacking header for older browsers.
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Browsers must use HTTPS for a year, including subdomains.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Stop browsers guessing file types.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Send only the origin (not full URLs) to other sites.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The site uses none of these browser features.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()
      # Isolate the page from cross-origin windows it opens.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Next.js build assets have content hashes in their names, so they can be cached forever.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
