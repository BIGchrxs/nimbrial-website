name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Confirm static export was produced
        run: |
          for page in out/index.html out/services/index.html out/about/index.html; do
            if [ ! -s "$page" ]; then
              echo "::error::Missing or empty $page"
              exit 1
            fi
          done
          echo "All pages exported."

  smoke-tests:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e

      # On failure, keep the HTML report (screenshots + traces) for 14 days to debug from.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
