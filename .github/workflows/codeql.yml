name: CodeQL

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    # Weekly full scan (Mondays 03:23 UTC) so newly published query rules are applied to unchanged code.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # required to upload results to the Security tab

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript: the site's source code.
        # actions: the GitHub Actions workflows themselves (injection, over-broad permissions, etc).
        language: [javascript-typescript, actions]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
